services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: clickhouse-bigdata
    restart: unless-stopped
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      CLICKHOUSE_DB: bigdata
      CLICKHOUSE_USER: estudiante
      CLICKHOUSE_PASSWORD: "ClickHouse2026!"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse

volumes:
  clickhouse_data:
